spring:
  application:
    name: store
  datasource:
    url: jdbc:mysql://localhost:3306/store_api?createDatabaseIfNotExist=true
    username: root
    password: ${mySqlPassword}
  jpa:
    show-sql: true
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpirationInSeconds: 300 #seconds in 5 minutes
    refreshTokenExpirationInSeconds: 604800 #seconds in 7 days
stripe:
  secret: ${STIPE_SECRET}
website:
  url: https://localhost:3000/