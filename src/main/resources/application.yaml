#All settings common in all environments. Need to specify the active profile
spring:
  application:
    name: store
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpirationInSeconds: 300 #seconds in 5 minutes
    refreshTokenExpirationInSeconds: 604800 #seconds in 7 days
  profiles:
    active: dev #At runtime, Spring will apply all settings here, then apply dev profile specific settings. Need to override this in the production environment using env variables
stripe:
  secret: ${STRIPE_SECRET}
  webhookSecretKey: ${STRIPE_WEBHOOK_SECRET_KEY}